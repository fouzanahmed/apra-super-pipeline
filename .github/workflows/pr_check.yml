name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest

    # Throwaway Postgres for dbt compile, so CI needs no cloud database or secrets.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned versions (ruff, dbt) so CI and local behave the same; unpinned ruff
      # once picked up new default rules and failed the PR.
      - name: Install dependencies
        run: pip install -r requirements-local.txt -r requirements-dbt.txt

      - name: Lint Python (ruff)
        run: ruff check ingestion/ api/ spark/ tests/

      - name: Unit tests (pytest)
        run: pytest -q

      - name: dbt compile (validates SQL without running)
        run: |
          mkdir -p ~/.dbt
          cp dbt_project/profiles.yml.example ~/.dbt/profiles.yml
          cd dbt_project && dbt compile --target dev
